<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<title>الماسح الضوئي</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0b0e14;
    --panel: #141924;
    --panel2: #1c2230;
    --line: #262d3d;
    --text: #eef1f7;
    --muted: #8b94a7;
    --green: #22c55e;
    --green-dark: #16a34a;
    --amber: #f59e0b;
  }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Inter", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Scan stage ---------- */
  #stage {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  .cam-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    background: #000;
    overflow: hidden;
  }
  #cam, #still {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  #overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    z-index: 5;
  }

  .empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    padding: 24px;
    background: radial-gradient(circle at 50% 40%, #16202e, #0b0e14 70%);
    z-index: 2;
  }
  .empty .big { display: block; font-size: 46px; margin-bottom: 12px; }

  .status {
    position: absolute;
    top: 76px;
    right: 50%;
    transform: translateX(50%);
    z-index: 8;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(20, 25, 36, 0.85);
    border: 1px solid var(--line);
    color: var(--muted);
    backdrop-filter: blur(4px);
    max-width: calc(100% - 64px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .scan-top { position:absolute; z-index:9; top:18px; left:18px; right:18px; display:flex; align-items:center; justify-content:space-between; direction:ltr; }
  .round-control { width:48px; height:48px; padding:0; border:0; border-radius:50%; background:rgba(255,255,255,.95); color:#15171d; display:grid; place-items:center; font-size:22px; box-shadow:0 5px 16px rgba(0,0,0,.22); }
  .scan-title { color:#fff; font-weight:700; font-size:15px; text-shadow:0 1px 3px #000; direction:rtl; }
  .status.ok { color: var(--green); border-color: rgba(34,197,94,.4); }
  .status.warn { color: var(--amber); border-color: rgba(245,158,11,.4); }
  .status.busy { color: var(--muted); }

  .toolbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: var(--panel);
    border-top: 1px solid var(--line);
    z-index: 10;
  }
  .toolbar button { flex: 1 1 120px; }
  button {
    font-family: inherit;
    border: 1px solid var(--line);
    background: var(--panel2);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active { transform: scale(.97); }
  button.primary { background: var(--green); border-color: var(--green); color: #06240f; }
  button.on { background: var(--green); border-color: var(--green); color: #06240f; }

  #btnRedo { margin-right: auto; margin-left: auto; }

  /* ---------- Floating action button (pencil = confirm crop) ---------- */
  #fab {
    position: absolute;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    width: 74px;
    height: 74px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    box-shadow: 0 6px 20px rgba(34,197,94,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #06240f;
    opacity: .55;
    transition: opacity .15s, transform .15s;
  }
  #fab.ready { opacity: 1; }
  #fab.ready::after { content:'تأكيد القص'; position:absolute; top:80px; color:#fff; background:rgba(0,0,0,.58); white-space:nowrap; padding:5px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  #fab.busy { pointer-events: none; opacity: .4; }
  #fab svg { width: 26px; height: 26px; }

  /* ---------- Result stage ---------- */
  #result {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    z-index: 40;
  }
  #result[hidden] { display: none; }
  .out-wrap {
    flex: 1;
    min-height: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  #out {
    max-width: 100%;
    max-height: 100%;
    border-radius: 6px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  .rtoolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 14px calc(16px + env(safe-area-inset-bottom));
    background: var(--panel);
    border-top: 1px solid var(--line);
  }
  .rtoolbar button { flex: 1; min-width: 72px; }
  #btnDownload { background: var(--green); border-color: var(--green); color: #06240f; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

  <!-- Scan stage: camera / still + overlay + toolbar + FAB -->
  <div id="stage">
    <div class="cam-wrap">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="still"></canvas>
      <div class="scan-top">
        <button class="round-control" type="button" onclick="window.parent.history.back()" aria-label="رجوع">‹</button>
        <div class="scan-title">امسح المستند</div>
        <button class="round-control" type="button" id="btnTopFile" aria-label="المعرض">▧</button>
      </div>
      <div class="empty" id="empty" hidden>
        <div><span class="big">📷</span>اضغط «اختر صورة» لفتح الكاميرا أو اختيار ملف</div>
      </div>
      <canvas id="overlay"></canvas>
      <div id="status" class="status">…</div>
    </div>

    <div class="toolbar">
      <button id="btnDetect" class="on">● الكشف التلقائي</button>
      <button id="btnCamera">📷 الكاميرا</button>
      <button id="btnFile">🖼 المعرض</button>
      <button id="btnRedo" hidden>↺ إعادة الكشف</button>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>
  </div>

  <button id="fab" aria-label="تأكيد الإطار" title="تأكيد وقصّ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
      <path d="m15 5 4 4"/>
    </svg>
  </button>

  <!-- Result stage -->
  <div id="result" hidden>
    <div class="out-wrap">
      <canvas id="out"></canvas>
    </div>
    <div class="rtoolbar">
      <button id="btnBack">↩ رجوع</button>
      <button id="btnOriginal">الأصل</button>
      <button id="btnClean">تصحيح الخلفية</button>
      <button id="btnColor">الحفاظ على الألوان</button>
      <button id="btnBw">أبيض/أسود</button>
      <button id="btnDownload">⬇ تحميل PNG</button>
      <button id="btnSave" class="primary">☁ حفظ في المستندات</button>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="main.js"></script>
</body>
</html>
